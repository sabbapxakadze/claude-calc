<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="calculator-wrapper">
    <div class="calculator" id="calculator">

      <!-- Header -->
      <div class="calc-header">
        <span class="calc-title">Calculator</span>
        <button class="mode-toggle" id="modeToggle" title="Toggle Scientific Mode">
          <span class="mode-icon">⚛</span>
        </button>
      </div>

      <!-- History Panel -->
      <div class="history-panel" id="historyPanel">
        <div class="history-header">
          <span>History</span>
          <button class="clear-history" id="clearHistory">Clear</button>
        </div>
        <ul class="history-list" id="historyList">
          <li class="history-empty">No history yet</li>
        </ul>
      </div>

      <!-- Display -->
      <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
        <div class="result-preview" id="preview"></div>
      </div>

      <!-- Scientific Buttons (hidden by default) -->
      <div class="sci-grid" id="sciGrid">
        <button class="btn btn-sci" data-action="sci" data-value="Math.sin(">sin</button>
        <button class="btn btn-sci" data-action="sci" data-value="Math.cos(">cos</button>
        <button class="btn btn-sci" data-action="sci" data-value="Math.tan(">tan</button>
        <button class="btn btn-sci" data-action="sci" data-value="Math.log10(">log</button>
        <button class="btn btn-sci" data-action="sci" data-value="Math.log(">ln</button>
        <button class="btn btn-sci" data-action="sci" data-value="Math.sqrt(">√</button>
        <button class="btn btn-sci" data-action="sci" data-value="Math.PI">π</button>
        <button class="btn btn-sci" data-action="sci" data-value="Math.E">e</button>
        <button class="btn btn-sci" data-action="sci" data-value="**">x^y</button>
        <button class="btn btn-sci" data-action="sci" data-value="(">( )</button>
      </div>

      <!-- Main Button Grid -->
      <div class="btn-grid">
        <!-- Row 1 -->
        <button class="btn btn-fn" data-action="clear">AC</button>
        <button class="btn btn-fn" data-action="sign">+/−</button>
        <button class="btn btn-fn" data-action="percent">%</button>
        <button class="btn btn-op" data-action="operator" data-value="÷">÷</button>

        <!-- Row 2 -->
        <button class="btn btn-num" data-action="number" data-value="7">7</button>
        <button class="btn btn-num" data-action="number" data-value="8">8</button>
        <button class="btn btn-num" data-action="number" data-value="9">9</button>
        <button class="btn btn-op" data-action="operator" data-value="×">×</button>

        <!-- Row 3 -->
        <button class="btn btn-num" data-action="number" data-value="4">4</button>
        <button class="btn btn-num" data-action="number" data-value="5">5</button>
        <button class="btn btn-num" data-action="number" data-value="6">6</button>
        <button class="btn btn-op" data-action="operator" data-value="−">−</button>

        <!-- Row 4 -->
        <button class="btn btn-num" data-action="number" data-value="1">1</button>
        <button class="btn btn-num" data-action="number" data-value="2">2</button>
        <button class="btn btn-num" data-action="number" data-value="3">3</button>
        <button class="btn btn-op" data-action="operator" data-value="+">+</button>

        <!-- Row 5 -->
        <button class="btn btn-num btn-zero" data-action="number" data-value="0">0</button>
        <button class="btn btn-num" data-action="decimal">.</button>
        <button class="btn btn-eq" data-action="equals">=</button>
      </div>

    </div>

    <!-- History toggle -->
    <button class="history-toggle" id="historyToggle" title="Toggle History">
      <span>⟳</span>
    </button>
  </div>

  <script src="js/calculator.js"></script>
</body>
</html>
